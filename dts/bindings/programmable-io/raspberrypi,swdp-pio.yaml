description: Raspberry Pi PIO-accelerated SWD port

compatible: "raspberrypi,swdp-pio"

# base.yaml: status/compatible/etc. pinctrl-device.yaml: pinctrl-0/pinctrl-names,
# used (the Zephyr way, as in raspberrypi,pico-uart-pio) to route SWCLK/SWDIO/SWDI
# to the PIO funcsel. swclk-pin/swdio-pin still give the PIO SM its side-set/out/in
# pin numbers; nRESET goes through reset-gpios.
include: [base.yaml, pinctrl-device.yaml]

properties:
  piodev:
    type: phandle
    required: true
    description: The PIO instance (pio0/pio1) hosting the SWD program.

  clk-gpios:
    type: phandle-array
    required: true
    description: SWCLK pin.

  dio-gpios:
    type: phandle-array
    required: true
    description: SWDIO pin (shared in/out on Pico; output on buffered probe).

  din-gpios:
    type: phandle-array
    description: Separate SWDIO input pin (buffered Debug Probe only).

  oen-gpios:
    type: phandle-array
    description: Output-enable pin for the level shifter (buffered probe only).

  reset-gpios:
    type: phandle-array
    description: Target nRESET pin (open-drain emulation).

  swclk-pin:
    type: int
    required: true
    description: SWCLK GPIO number (PIO side-set base).

  swdio-pin:
    type: int
    required: true
    description: SWDIO GPIO number (PIO out/in base).
