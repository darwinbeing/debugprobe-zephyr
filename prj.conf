CONFIG_CPP=y
CONFIG_STD_CPP20=y
# GLIBCXX_LIBCPP (full libstdc++) depends on NEWLIB_LIBC || PICOLIBC;
# the gnuarmemb toolchain only provides newlib, so select it explicitly.
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_LOG=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
# CDC-ACM <-> target uart1 bridge is now a custom C++ UartBridge
# (src/uart_bridge.cpp), replacing the closed zephyr,uart-bridge so phase 4b
# can tap byte flow (activity LEDs) and intercept MAGIC_BAUD (autobaud). The
# bridge is interrupt-driven and ring-buffered, so it needs these explicitly
# (UART_INTERRUPT_DRIVEN was previously auto-selected by UART_BRIDGE):
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
# Autobaud (src/autobaud/autobaud.cpp) uses a k_event to start/stop its
# capture thread, and uart_configure() to apply the detected baud at runtime.
CONFIG_EVENTS=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_DP_DRIVER=y
# Default SWD backend: PIO-accelerated (raspberrypi,swdp-pio). Flips the
# Kconfig choice default (BITBANG). The overlays default swd_pio=okay /
# swd_bitbang=disabled to match; switching to bitbang requires flipping both.
CONFIG_PROBE_SWD_PIO=y
# SWD block DMA (drivers/dp_pio): Zephyr DMA controller, not the raw SDK.
CONFIG_DMA=y
CONFIG_DMA_RPI_PICO=y
