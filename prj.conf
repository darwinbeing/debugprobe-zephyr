CONFIG_CPP=y
CONFIG_STD_CPP20=y
# GLIBCXX_LIBCPP (full libstdc++) depends on NEWLIB_LIBC || PICOLIBC;
# the gnuarmemb toolchain only provides newlib, so select it explicitly.
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_LOG=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_HWINFO=y
CONFIG_GPIO=y
CONFIG_DP_DRIVER=y
# Default SWD backend: PIO-accelerated (raspberrypi,swdp-pio). Flips the
# Kconfig choice default (BITBANG). The overlays default swd_pio=okay /
# swd_bitbang=disabled to match; switching to bitbang requires flipping both.
CONFIG_PROBE_SWD_PIO=y
